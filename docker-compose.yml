services:
  algscr:
    build: .
    container_name: algscr
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - LASTFM_USER=${LASTFM_USER:-GIRAL4}
      - LASTFM_API_KEY=${LASTFM_API_KEY}
