<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ALGSCR — Music Globe</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- Globe 3D container fills the full viewport -->
  <div id="globe-container"></div>

  <!-- Title overlay -->
  <header class="app-header">
    <span class="app-logo">🌍</span>
    <span class="app-title">ALGSCR</span>
    <span class="app-subtitle">Music Globe</span>
  </header>

  <!-- Loading spinner -->
  <div id="loading" class="loading-overlay" aria-live="polite">
    <div class="spinner"></div>
    <p class="loading-text">Loading your music world…</p>
  </div>

  <!-- Error banner -->
  <div id="error-banner" class="error-banner hidden" role="alert">
    <span id="error-message"></span>
    <button class="error-close" onclick="document.getElementById('error-banner').classList.add('hidden')">✕</button>
  </div>

  <!-- Country detail panel -->
  <aside id="country-panel" class="country-panel hidden" aria-label="Country tracks">
    <button class="panel-close" id="panel-close-btn" aria-label="Close">✕</button>
    <div class="panel-header">
      <div class="panel-color-dot" id="panel-color-dot"></div>
      <div>
        <h2 class="panel-country-name" id="panel-country-name">Country</h2>
        <p class="panel-album-name" id="panel-album-name"></p>
      </div>
    </div>
    <div class="panel-album-art-wrapper">
      <img id="panel-album-art" class="panel-album-art hidden" alt="Top album cover" />
    </div>
    <p class="panel-track-count" id="panel-track-count"></p>
    <ul class="track-list" id="track-list"></ul>
  </aside>

  <!-- Legend -->
  <div class="legend">
    <span class="legend-dot legend-dot--active"></span> Recently played
    <span class="legend-dot legend-dot--inactive"></span> Other countries
  </div>

  <!-- Scripts -->
  <script src="globe.gl.min.js"></script>
  <script src="ui.js"></script>
  <script src="globe.js"></script>
</body>

</html>
